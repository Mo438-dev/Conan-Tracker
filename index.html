*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:grid;gap:20px}
header{display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-weight:700;font-size:2.6rem;line-height:1;margin:0;color:var(--ink);text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.big{text-align:left;font-variant-numeric:tabular-nums}
.big b{font-family:var(--f-num);font-size:1.9rem;color:var(--ink)}
.big span{color:var(--muted);font-size:.85rem;display:block}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.seg{position:relative;background:color-mix(in oklab,var(--c) 22%,var(--surface))}
.seg i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--c);transition:width .3s}
.next{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.next .lbl{color:var(--muted);font-size:.8rem;letter-spacing:.02em}
.next b{font-family:var(--f-num)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip small{color:var(--muted);font-family:var(--f-num);font-size:.75rem}
.chip[aria-pressed="true"]{background:color-mix(in oklab,var(--c,var(--ink)) 20%,var(--surface));border-color:var(--c,var(--ink))}
.chip:focus-visible,.check:focus-visible,.date:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.legend span{display:inline-flex;gap:4px;align-items:center}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li.row{--c:var(--a0);display:grid;grid-template-columns:auto 5.6rem 1fr auto;gap:12px;align-items:center;
  padding:11px 14px;border-radius:10px;background:color-mix(in oklab,var(--c) var(--tint),var(--surface));
  border:1px solid color-mix(in oklab,var(--c) 35%,transparent)}
li.row.done{background:color-mix(in oklab,var(--c) 8%,var(--surface));border-color:var(--line)}
li.row.done .title{color:var(--muted)}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--c);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;color:#fff}
.check svg{width:16px;height:16px;opacity:0}
.done .check{background:var(--c)} .done .check svg{opacity:1}
.code{font-family:var(--f-num);font-weight:600;font-size:.88rem;direction:ltr;text-align:right;color:var(--fg)}
.code small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.main{min-width:0;display:grid;gap:3px}
.title{direction:ltr;text-align:right;font-weight:600;overflow-wrap:anywhere}
.title.struck{text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.78rem;color:var(--muted);align-items:center}
.pill{background:color-mix(in oklab,var(--c) 85%,#000 0%);color:#fff;padding:1px 8px;border-radius:5px;font-weight:500;direction:ltr}
.pill.b{--c:var(--a4)}
.meta .ltr{direction:ltr;unicode-bidi:isolate}
.side{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.icons{display:flex;gap:4px}
.ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface);color:var(--fg)}
.ic svg{width:14px;height:14px}
.ic.key{color:#b8860b} .ic.fav{color:#e0603a} .ic.up{color:var(--ink)} .ic.new{color:var(--ok)}
.date{font:inherit;font-size:.76rem;font-weight:500;color:var(--ok);background:none;border:0;padding:0;cursor:pointer;direction:ltr}
.date input{font:inherit;font-size:.78rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.empty{color:var(--muted);text-align:center;padding:30px}
.status{font-size:.75rem;color:var(--muted)}
@media (max-width:560px){

  .code{grid-column:2;grid-row:1;text-align:right}
  .main{grid-column:1/-1;grid-row:2}
  .side{grid-column:3;grid-row:1;align-items:flex-end}

function epCount(id){const m=id.slice(1).split('-').map(Number);return m.length>1?m[1]-m[0]+1:1}
const TOTAL_EPS = DATA.reduce((s,d)=>s+epCount(d.id),0);

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(iso){try{return new Date(iso+"T12:00:00").toLocaleDateString("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short",year:"numeric"})}catch(e){return iso}}

function render(){
  const done = DATA.filter(d=>watched[d.id]);
  const doneEps = done.reduce((s,d)=>s+epCount(d.id),0);
  document.getElementById("pct").textContent = Math.round(done.length/DATA.length*100)+"%"; document.getElementById("pct2").textContent = done.length+"/"+DATA.length;
  document.getElementById("cnt").textContent = `${done.length} من ${DATA.length} مدخل · ${doneEps}/${TOTAL_EPS} حلقة`;
  const bar=document.getElementById("bar"); bar.innerHTML="";
  ARCS.forEach((a,i)=>{
    const items=DATA.filter(d=>d.c[0]===a[0]); if(!items.length)return;
    const dn=items.filter(d=>watched[d.id]).length;
    const s=document.createElement("div"); s.className="seg"; s.style.setProperty("--c",`var(--a${i})`);
    s.style.flex=items.length; s.title=`${a[1]}: ${dn}/${items.length}`;
    s.innerHTML=`<i style="width:${dn/items.length*100}%"></i>`; bar.appendChild(s);
  });
  const nx=DATA.find(d=>!watched[d.id]);
  const lastDone=Object.entries(watched).sort((a,b)=>a[1]<b[1]?1:-1)[0];
  document.getElementById("next").innerHTML = nx
    ? `<span class="lbl">التالية</span><b dir="ltr">${nx.id}</b><bdi dir="ltr">${nx.t}</bdi>`+(lastDone?`<span class="lbl" style="margin-inline-start:auto">آخر تشييك: ${fmt(lastDone[1])}</span>`:"")
    : `<b>خلّصت القائمة كلها 🎉</b>`;
  const ac=document.getElementById("arcs"); ac.innerHTML="";
  const mk=(label,val,ci,n)=>{const b=document.createElement("button");b.className="chip";if(ci!=null)b.style.setProperty("--c",`var(--a${ci})`);
    b.setAttribute("aria-pressed",arcFilter===val);b.innerHTML=(ci!=null?'<span class="dot"></span>':"")+label+(n!=null?` <small>${n}</small>`:"");
    b.onclick=()=>{arcFilter=val;render()};ac.appendChild(b)};
  mk("الكل",null,null,null);
  ARCS.forEach((a,i)=>{const it=DATA.filter(d=>d.c.includes(a[0]));mk(a[1],a[0],i,`${it.filter(d=>watched[d.id]).length}/${it.length}`)});
  const sc=document.getElementById("states"); sc.innerHTML="";
  [["all","الكل"],["todo","المتبقي"],["done","المشاهَد"]].forEach(([v,l])=>{const b=document.createElement("button");b.className="chip";
    b.setAttribute("aria-pressed",stateFilter===v);b.textContent=l;b.onclick=()=>{stateFilter=v;render()};sc.appendChild(b)});
  const list=document.getElementById("list"); list.innerHTML="";
  const rows=DATA.filter(d=>(!arcFilter||d.c.includes(arcFilter))&&(stateFilter==="all"||(stateFilter==="done")===!!watched[d.id])&&matchQ(d));
  if(!rows.length){list.innerHTML='<li class="empty">ما فيه حلقات بهالفلتر</li>';return}
  for(const d of rows){
    const ci=arcIdx[d.c[0]], w=watched[d.id], n=epCount(d.id);
    const li=document.createElement("li"); li.className="row"+(w?" done":""); li.id="row-"+d.id; li.style.setProperty("--c",`var(--a${ci})`);
    const pills=d.c.map(c=>`<span class="pill" style="--c:var(--a${arcIdx[c]})">${ARCS[arcIdx[c]][1]}</span>`).join("");
    const icons=d.f.filter(f=>ICON[f]).map(f=>`<span class="ic ${f}" title="${FLAG[f]}" aria-label="${FLAG[f]}">${ICON[f]}</span>`).join("");
    li.innerHTML=`
      <button class="check" id="c-${d.id}" aria-pressed="${!!w}" aria-label="تشييك ${d.id}">${ICON.check}</button>
      <div class="code">${d.id}${n>1?`<small>${n} حلقات</small>`:""}</div>
      <div class="main">
        <div class="title">${d.t}</div>
        <div class="meta">${pills}${d.ch?`<span>شخصية: <span class="ltr">${d.ch}</span></span>`:""}${d.n?`<span>المقطع: <span class="ltr">${d.n}</span></span>`:""}</div>
      </div>
      <div class="side"><div class="icons">${icons}</div>${w?(editing===d.id?`<span class="date"><input type="date" id="d-${d.id}" value="${w}"></span>`:`<button class="date" title="تعديل التاريخ">${fmt(w)}</button>`):""}</div>`;
    li.querySelector(".check").onclick=()=>toggle(d.id);
    const db_=li.querySelector("button.date"); if(db_) db_.onclick=()=>{editing=d.id;render();const inp=document.getElementById("d-"+d.id);inp&&inp.focus()};
    const inp=li.querySelector("input[type=date]"); if(inp){inp.onchange=()=>{if(inp.value)setDate(d.id,inp.value);editing=null;render()};inp.onblur=()=>{editing=null;setTimeout(render,0)}}
    list.appendChild(li);
  }
}
function legend(){document.getElementById("legend").innerHTML=Object.entries(FLAG).map(([k,v])=>`<span><span class="ic ${k}">${ICON[k]}</span>${v}</span>`).join("")}

function saveLocal(){try{localStorage.setItem("conan-watched",JSON.stringify(watched))}catch(e){}}
function status(s){document.getElementById("status").textContent=s}
let pending=0;
async function push(id,val){
  pending++;
  try{
    const r=await fetch("/api/watched",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,date:val||null})});
    if(!r.ok) throw new Error(r.status);
    status("القائمة مشتركة، وأي تشييك يظهر للكل.");
  }catch(e){status("ما انحفظ آخر تغيير، تأكد من النت وجرّب مرة ثانية.")}
  finally{pending--}
}
async function pull(){
  if(editing||pending) return;
  try{
    const r=await fetch("/api/watched",{cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const server=await r.json();
    if(editing||pending) return;
    let migrated=false; try{migrated=localStorage.getItem("conan-migrated")==="1"}catch(e){}
    if(!migrated){ // one time: send checks this browser had before the list became shared
      for(const [k,v] of Object.entries(watched)) if(!server[k]){server[k]=v; push(k,v)}
      try{localStorage.setItem("conan-migrated","1")}catch(e){}
    }
    watched=server; saveLocal(); render();
    status("القائمة مشتركة، وأي تشييك يظهر للكل.");
  }catch(e){status("ما قدرت أجيب آخر تحديث، المعروض هو آخر نسخة في هالمتصفح.")}
}
function matchQ(d){
  let q=(document.getElementById("q")?.value||"").trim().toLowerCase().replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);
  if(!q) return true;
  const n=q.replace(/^[em]\s*/,"");
  if(/^\d+$/.test(n)){const [a,b]=d.id.slice(1).split("-").map(Number);const N=+n;return N>=a&&N<=(b||a)}
  return d.t.toLowerCase().includes(q)||(d.ch||"").toLowerCase().includes(q)||d.id.toLowerCase().includes(q);
}
function jumpNext(){
  const nx=DATA.find(d=>!watched[d.id]); if(!nx) return;
  arcFilter=null; stateFilter="all"; const q=document.getElementById("q"); if(q) q.value="";
  render();
  const el=document.getElementById("row-"+nx.id);
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1700)}
}
let toastT=null;
function toast(msg,undo){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";el.dir="rtl";document.body.appendChild(el)}
  el.innerHTML="<span></span>"+(undo?"<button>تراجع</button>":""); el.firstChild.textContent=msg;
  if(undo) el.querySelector("button").onclick=()=>{undo();el.classList.remove("show")};
  requestAnimationFrame(()=>el.classList.add("show"));
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),4000);
}
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function burstAt(rect,color){
  if(!rect||calm) return;
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let i=0;i<14;i++){
    const p=document.createElement("i"); p.className="spark"; p.style.background=i%3?color:"#ffd34d";
    const a=Math.PI*2*i/14+Math.random()*.4, dist=24+Math.random()*24;
    p.style.left=cx+"px"; p.style.top=cy+"px";
    p.style.setProperty("--dx",Math.cos(a)*dist+"px"); p.style.setProperty("--dy",Math.sin(a)*dist+"px");
    document.body.appendChild(p); setTimeout(()=>p.remove(),700);
  }
}
function confetti(colors,count){
  if(calm) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1; c.width=W*dpr; c.height=H*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const P=[...Array(count)].map((_,i)=>{const side=i%2?1:-1;return{x:side>0?W+10:-10,y:H*0.75,vx:-side*(6+Math.random()*9),vy:-(11+Math.random()*10),r:Math.random()*6,vr:(Math.random()-.5)*.35,w:7+Math.random()*6,h:4+Math.random()*4,c:colors[i%colors.length]}});
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);
    for(const p of P){p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(t-t0<3500) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function cheer(title,sub,color){
  document.querySelectorAll(".cheer").forEach(e=>e.remove());
  const el=document.createElement("div"); el.className="cheer"; el.dir="rtl"; el.style.setProperty("--c",color);
  el.innerHTML="<small></small><b></b><small></small>"; el.children[0].textContent="🎉 مبروك"; el.children[1].textContent=title; el.children[2].textContent=sub;
  el.onclick=()=>el.remove(); document.body.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),450)},3200);
}
function celebrateArcs(d){
  if(DATA.every(x=>watched[x.id])){confetti(["#ffd34d","#e06f83","#6f95cf","#62b981","#a57bd1","#e8894a"],260);cheer("خلّصتوا كونان كله!","137 من 137","#d6ad3e");return}
  for(const arc of d.c){
    const items=DATA.filter(x=>x.c.includes(arc));
    if(items.every(x=>watched[x.id])){
      const i=arcIdx[arc], col=getComputedStyle(document.documentElement).getPropertyValue("--a"+i).trim()||"#4676c4";
      confetti([col,"#ffd34d","#ffffff",col],170); cheer("خلّصتوا آرك "+ARCS[i][1],items.length+" من "+items.length,col); return;
    }
  }
}
function toggle(id){
  const prev=watched[id], btn=document.getElementById("c-"+id), rect=btn&&btn.getBoundingClientRect();
  const row=btn&&btn.closest("li"), color=(row&&getComputedStyle(row).getPropertyValue("--c").trim())||"#4676c4";
  if(prev){delete watched[id];push(id,null)}else{watched[id]=today();push(id,watched[id])}
  saveLocal(); render();
  if(!prev){const nb=document.getElementById("c-"+id); if(nb) nb.classList.add("pop"); burstAt(rect,color); celebrateArcs(DATA.find(x=>x.id===id))}
  toast(prev?"شلت التشييك عن "+id:"تم تشييك "+id,()=>{
    if(prev){watched[id]=prev;push(id,prev)}else{delete watched[id];push(id,null)}
    saveLocal(); render();
  });
}
function setDate(id,v){watched[id]=v;saveLocal();push(id,v)}

try{watched=JSON.parse(localStorage.getItem("conan-watched")||"{}")||{}}catch(e){}
legend(); render(); status("جاري التحميل…");
pull(); setInterval(pull,8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
document.getElementById("q").addEventListener("input",()=>render());
document.getElementById("next").onclick=jumpNext;
document.getElementById("refresh").onclick=async e=>{
  const b=e.currentTarget; b.classList.add("spin");
  try{const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update()}catch(_){}
  location.reload();
};
